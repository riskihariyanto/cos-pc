<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0055A5">
<title>Kuitansi COS PWA</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kuitansi COS">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="loginView" hidden>
  <div class="card">
    <div class="login-head">
      <img class="login-logo" src="icons/icon-192.png" alt="Logo Kuitansi COS" width="72" height="72">
      <h1 class="login-judul">SISTEM APLIKASI KUITANSI IURAN COS</h1>
      <div class="login-sub">PC FSP RTMM SPSI KABUPATEN TANGERANG</div>
      <p class="login-desk">Kelola administrasi setoran iuran anggota PUK secara cepat, transparan, dan terverifikasi.</p>
    </div>
    <label for="lId">Nama Pengguna / ID</label>
    <input id="lId" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
    <label for="lPass">Kata Sandi</label>
    <input id="lPass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn" style="width:100%;padding:15px 16px;font-size:17px;margin-top:18px" onclick="doLogin()">Masuk</button>
    <button type="button" class="btn alt btn-pasang" id="btnPasang" onclick="pasangAplikasi()" hidden>Pasang Aplikasi di HP</button>
  </div>
</div>

<div id="appView" hidden>
  <header>
    <div><b id="who"></b><small id="role"></small></div>
    <button onclick="doLogout()">Keluar</button>
  </header>
  <nav id="nav" aria-label="Menu utama"></nav>
  <main id="content" aria-live="polite"></main>
</div>

<a id="fabWA" class="fab-wa" href="https://wa.me/6281383179209" target="_blank" rel="noopener" onclick="return bukaBantuanWA(this)" aria-label="Hubungi bantuan lewat WhatsApp">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.5 8.5 0 0 1-12.6 7.4L3 20.5l1.7-5.2A8.5 8.5 0 1 1 21 11.5z"/><path d="M9 8.5c0 3.3 2.7 6 6 6l1.3-1.6-2-1-.9.8a4 4 0 0 1-1.7-1.7l.8-.9-1-2z"/></svg>
  <span>Bantuan</span>
</a>

<div id="busy" hidden role="status">Memproses...</div>
<div id="toast" hidden role="alert"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>

<script src="js/config.js"></script>
<script src="js/util.js"></script>
<script src="js/state.js"></script>
<script src="js/kuitansi.js"></script>
<script src="js/puk.js"></script>
<script src="js/pc.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
<script src="js/pwa.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
