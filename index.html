<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0055A5">
<title>Iuran COS</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="loginView" hidden>
  <div class="card">
    <h2>Iuran COS</h2>
    <label for="lId">Nama Pengguna / ID</label>
    <input id="lId" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
    <label for="lPass">Kata Sandi</label>
    <input id="lPass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn" style="width:100%;padding:15px 16px;font-size:17px;margin-top:18px" onclick="doLogin()">Masuk</button>
  </div>
</div>

<div id="appView" hidden>
  <header>
    <div><b id="who"></b><small id="role"></small></div>
    <button onclick="doLogout()">Keluar</button>
  </header>
  <nav id="nav" aria-label="Menu utama"></nav>
  <main id="content" aria-live="polite"></main>
</div>

<div id="busy" hidden role="status">Memproses...</div>
<div id="toast" hidden role="alert"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>

<script src="js/config.js"></script>
<script src="js/util.js"></script>
<script src="js/state.js"></script>
<script src="js/kuitansi.js"></script>
<script src="js/puk.js"></script>
<script src="js/pc.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
